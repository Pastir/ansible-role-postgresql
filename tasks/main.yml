---
- name: Validate input
  ansible.builtin.assert:
    that:
      - postgresql_version | string is match('^\d+$')
      - postgresql_minor_version | string == '' or postgresql_minor_version | string is match('^' ~ postgresql_version ~ '\.\d+$')
      - postgresql_start_conf in ['auto', 'manual', 'disabled']
      - postgresql_hba_entries | rejectattr('type', 'defined') | list | length == 0
      - postgresql_hba_entries | rejectattr('method', 'defined') | list | length == 0
    fail_msg: >-
      postgresql_version must be a major version ("15"), postgresql_minor_version must be "<major>.<minor>",
      postgresql_start_conf must be auto|manual|disabled, every hba entry needs type and method.
    quiet: true
  tags: [postgresql, postgresql_install, postgresql_config]

- name: Install PostgreSQL
  ansible.builtin.import_tasks: install.yml
  tags: [postgresql, postgresql_install]

- name: Configure PostgreSQL
  ansible.builtin.import_tasks: configure.yml
  tags: [postgresql, postgresql_config]

# Can also be run on its own: include_role with tasks_from: objects.yml (e.g. after pastir.patroni).
- name: Manage users, databases and privileges
  ansible.builtin.import_tasks: objects.yml
  when: __postgresql_manage_objects | bool
  tags: [postgresql, postgresql_objects]
