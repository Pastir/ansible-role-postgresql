---
- name: Verify standalone servers
  hosts: standalone
  become: true
  tasks:
    - name: Server version is 15.19 and packages are held
      ansible.builtin.shell: |
        set -o pipefail
        dpkg-query -W -f='${Version}' postgresql-15
        echo
        apt-mark showhold | grep -x postgresql-15
      args:
        executable: /bin/bash
      register: __pkg
      changed_when: false
      failed_when: __pkg.stdout_lines[0] is not match('15.19-')

    - name: Read effective settings
      ansible.builtin.command: >-
        psql -XAtq -c "SELECT name || '=' || setting || coalesce(unit,'') FROM pg_settings
        WHERE name IN ('work_mem','max_connections','log_min_duration_statement')"
      become: true
      become_user: postgres
      register: __settings
      changed_when: false

    - name: Reloadable change applied, restart-only change still pending
      ansible.builtin.assert:
        that:
          - "'work_mem=32768kB' in __settings.stdout_lines"
          - "'max_connections=150' in __settings.stdout_lines"
          - "'log_min_duration_statement=1000ms' in __settings.stdout_lines"

    - name: Managed pg_hba.conf is loaded without errors
      ansible.builtin.command: psql -XAtq -c "SELECT count(*) FROM pg_hba_file_rules WHERE error IS NULL"
      become: true
      become_user: postgres
      register: __hba
      changed_when: false
      failed_when: __hba.stdout | int != 4

    - name: Read start.conf
      ansible.builtin.slurp:
        src: /etc/postgresql/15/main/start.conf
      register: __start_conf

    - name: Cluster start mode is auto, stock comments of pg_createcluster are kept
      vars:
        __lines: "{{ (__start_conf.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - __lines | select('match', '^\\s*(auto|manual|disabled)\\s*$') | list == ['auto']
          - "'# Automatic startup configuration' in __lines"
          - __lines | select('match', '^#\\s+manual:\\s') | list | length == 1
          - __lines | select('search', 'Ansible') | list | length == 0

- name: Verify Patroni node layout
  hosts: patroni_node
  become: true
  tasks:
    - name: No cluster was created
      ansible.builtin.command: pg_lsclusters -h
      register: __clusters
      changed_when: false
      failed_when: __clusters.stdout | length > 0

    - name: Binaries are installed
      ansible.builtin.stat:
        path: /usr/lib/postgresql/15/bin/postgres
      register: __bin
      failed_when: not __bin.stat.exists

    - name: Main cluster creation is disabled
      ansible.builtin.command: grep -qx 'create_main_cluster = false' /etc/postgresql-common/createcluster.conf
      changed_when: false

- name: Verify users, databases and privileges
  hosts: standalone
  become: true
  tasks:
    - name: User app_user logs in to appdb over TCP with its password (scram-sha-256)
      ansible.builtin.command: >-
        psql -XAtq -h 127.0.0.1 -U app_user -d appdb
        -c "SELECT current_user || ',' || (SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'appdb')"
      environment:
        PGPASSWORD: "app'pass#1"
      register: __login
      changed_when: false
      failed_when: __login.stdout != 'app_user,app_user'

    - name: Read role attributes, password hash type, encoding and the grant
      ansible.builtin.command: >-
        psql -XAtq -c "SELECT r.rolcanlogin || ',' || r.rolcreatedb || ',' || r.rolconnlimit || ','
        || left(a.rolpassword, 13) || ',' || pg_encoding_to_char(d.encoding) || ','
        || has_database_privilege('report_user', 'appdb', 'CREATE')
        FROM pg_roles r JOIN pg_authid a ON a.oid = r.oid, pg_database d
        WHERE r.rolname = 'app_user' AND d.datname = 'appdb'"
      become: true
      become_user: postgres
      register: __attrs
      changed_when: false
      failed_when: __attrs.stdout != 'true,true,20,SCRAM-SHA-256,UTF8,true'

    - name: User report_user logs in with its password
      ansible.builtin.command: psql -XAtq -h 127.0.0.1 -U report_user -d appdb -c "SELECT 1"
      environment:
        PGPASSWORD: report pass 2
      changed_when: false

- name: Verify that objects were skipped on the Patroni-style node
  hosts: patroni_node
  become: true
  tasks:
    - name: Module psycopg2 is installed for the modules
      ansible.builtin.command: python3 -c "import psycopg2"
      changed_when: false
