---
# pg-standalone-*: managed standalone server with config and pg_hba.
# pg-patroni-node: package only, no auto-created cluster, start.conf manual (Patroni node layout).
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
platforms:
  - name: pg-standalone-noble
    image: docker.io/library/ubuntu:24.04
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    systemd: always
    groups: [standalone]
  - name: pg-standalone-resolute
    image: docker.io/library/ubuntu:26.04
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    systemd: always
    groups: [standalone]
  - name: pg-patroni-node
    image: docker.io/library/ubuntu:24.04
    dockerfile: Dockerfile.j2
    command: /lib/systemd/systemd
    systemd: always
    groups: [patroni_node]
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        postgresql_version: "15"
        postgresql_minor_version: "15.19"
        # Users, databases, privileges: created on standalone servers (primary),
        # skipped on pg-patroni-node (no running instance, postgresql_manage_service: false).
        # Group roles are listed after their members on purpose: all roles are created before memberships.
        # cert_user has no password: a password set outside Ansible must stay untouched.
        postgresql_users:
          - name: app_user
            password: "app'pass#1"
            role_attr_flags: LOGIN,CREATEDB
            conn_limit: 20
            groups: [readonly]
          - name: report_user
            password: "report pass 2"
          - name: cert_user
            groups: [readonly, writers]
          - {name: readonly, role_attr_flags: NOLOGIN}
          - {name: writers, role_attr_flags: NOLOGIN}
          - name: no_such_user
            state: absent
        postgresql_databases:
          - name: appdb
            owner: app_user
            encoding: UTF8
            template: template0
          # No owner: the owner of the existing database must not be changed.
          - name: legacydb
        postgresql_privileges:
          - database: appdb
            roles: report_user
            privs: CREATE
      standalone:
        postgresql_conf:
          max_connections: 150
          work_mem: 16MB
          log_min_duration_statement: 1000
          listen_addresses: "'*'"
        postgresql_hba_entries:
          - {type: local, database: all, user: postgres, method: peer}
          - {type: local, database: all, user: all, method: peer}
          - {type: host, database: all, user: all, address: 127.0.0.1/32, method: scram-sha-256}
          - {type: host, database: app, user: app, address: 10.0.0.0/8, method: scram-sha-256, comment: application}
      patroni_node:
        postgresql_create_main_cluster: false
        postgresql_start_conf: manual
        postgresql_manage_service: false
        postgresql_objects_wait_timeout: 3
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
verifier:
  name: ansible
